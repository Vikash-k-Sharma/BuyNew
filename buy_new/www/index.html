<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" />
    <link rel="icon" href="/assets/buy_new/images/buynew-logo.webp" type="image/webp">
    <title>{{ title }}</title>

    {% if preload_image %}
    <link rel="preload" as="image" href="{{ preload_image }}" fetchpriority="high">
    {% endif %}

    <script>window.frappe = window.frappe || {};</script>
    <!-- csrf_token -->

    {% for css in css_files %}
    <link rel="stylesheet" href="/assets/buy_new/frontend/{{ css }}">
    {% endfor %}

</head>

<body>

    <div id="app"></div>

    {% for js in js_files %}
    <script type="module" src="/assets/buy_new/frontend/{{ js }}">
    </script>
    {% endfor %}

</body>

</html>
